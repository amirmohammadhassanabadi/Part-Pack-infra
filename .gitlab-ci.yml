stages:
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG == "production"'
    - when: never

deploy:
  stage: deploy
  tags:
    - part-pack-infra
  rules:
    - if: '$DEPLOY_SERVICE == "frontend" || $DEPLOY_SERVICE == "backend"'
    - if: '$CI_COMMIT_TAG == "production"'
    - when: never
  script:
    - bash /srv/part-pack/infra/deploy-script.sh
