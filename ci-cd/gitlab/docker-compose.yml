services:
  gitlab:
    image: gitlab/gitlab-ce:19.1.7-ce.0
    container_name: gitlab
    restart: always
    hostname: gitlab.part-pack.ir
    shm_size: "512m"
    ports:
      - "80:80"
      - "443:443"
      - "2222:22"
    volumes:
      - /srv/gitlab/config:/etc/gitlab
    networks:
      - gitlab-net

networks:
  gitlab-net:
    name: gitlab-net
    driver: bridge
