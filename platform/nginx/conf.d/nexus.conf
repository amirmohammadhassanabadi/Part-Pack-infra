# ==============================================================================
# 1. Nexus Web UI & NPM Registry (Port 443)
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name registry.part-pack.ir;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Allow uploading large NPM packages / build artifacts
    client_max_body_size 1024m;

    location / {
        proxy_pass http://nexus:8081;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}

# ==============================================================================
# 2. Nexus Private / Hosted Docker Registry (Port 8082)
# ==============================================================================
server {
    listen 8082 ssl;
    listen [::]:8082 ssl;
    http2 on;
    server_name registry.part-pack.ir;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Disable payload limit for Docker layer pushes
    client_max_body_size 0;

    # Disable buffering for chunked streaming of Docker image layers
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://nexus:8082;

        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 900s;
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
    }
}

# ==============================================================================
# 3. Nexus Docker Hub Pull-Through Cache / Proxy (Port 8083)
# ==============================================================================
