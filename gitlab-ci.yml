stages:
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

deploy:
  stage: deploy
  tags:
    - part-pack
  rules:
    - if: '$DEPLOY_SERVICE == "frontend" || DEPLOY_SERVICE == "backend"'
    - when: never
  script:
    - docker compose up -d --no-deps --force-recreate "$DEPLOY_SERVICE"
