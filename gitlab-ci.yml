stages:
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG == "production"'
    - when: never

deploy:
  stage: deploy
  tags:
    - part-pack
  rules:
    - if: '$DEPLOY_SERVICE == "frontend" || $DEPLOY_SERVICE == "backend"'
    - when: never
  script:
    - chmod +x /srv/part-pack/infra/deploy-script.sh
    - /srv/part-pack/infra/deploy-script.sh
